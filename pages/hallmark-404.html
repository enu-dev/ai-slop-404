<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — ページが見つかりません</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500&family=Inter:wght@500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/hallmark-404.css">
</head>
<body>
  <main class="page">
    <p class="page__kicker">Error 404 — Not Found</p>

    <div class="page__body">
      <h1 class="page__headline">そのページは、ここにはありません。</h1>
      <p class="page__lede">
        アドレスの打ち間違いか、ページが移動または削除された可能性があります。
        お探しの内容は、トップページからもう一度たどれます。
      </p>
      <div class="page__actions">
        <a class="btn" href="#">トップページへ戻る</a>
        <a class="link-back" href="#">
          <span class="link-back__arrow" aria-hidden="true">←</span>
          ひとつ前のページに戻る
        </a>
      </div>
    </div>

    <p class="page__numeral" aria-hidden="true">404</p>
  </main>
</body>
</html>
